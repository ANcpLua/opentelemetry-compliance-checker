name: OpenTelemetry compliance check
description: Check telemetry files or test workloads against OpenTelemetry semantic conventions.
branding:
  icon: check-circle
  color: blue
inputs:
  file:
    description: Weaver sample JSON file, used when run is empty.
    default: telemetry.json
  run:
    description: Test command to run with a local OTLP/gRPC receiver.
    default: ''
  registry:
    description: Weaver registry. Defaults to pinned upstream Semantic Conventions.
    default: ''
  baseline-registry:
    description: Baseline registry for compatibility checks; omitted means NOT_CHECKED.
    default: ''
  policies:
    description: Additional Rego files or directories, one path per line. Bundled advisors stay enabled.
    default: ''
  advice-data:
    description: Weaver glob for additional JSON/YAML Rego data.
    default: ''
  require:
    description: Space-separated layers that must have evidence (syntax semantics behavior stability compatibility).
    default: ''
  fail-on:
    description: Minimum finding level that fails CI (violation, improvement, information).
    default: violation
  timeout:
    description: Maximum test or file-check duration in seconds.
    default: '300'
  output:
    description: Report directory.
    default: otel-report
outputs:
  summary:
    description: Absolute path to summary.json.
    value: ${{ steps.check.outputs.summary }}
runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/scripts/action.py" pins
    - uses: open-telemetry/weaver/.github/actions/setup-weaver@38befce4bc68fe320d20f189465c93835ac20c12 # v0.26.1
      with:
        version: ${{ steps.pins.outputs.version }}
    - id: check
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/scripts/action.py" check
      env:
        CHECK_FILE: ${{ inputs.file }}
        CHECK_RUN: ${{ inputs.run }}
        CHECK_REGISTRY: ${{ inputs.registry }}
        CHECK_BASELINE_REGISTRY: ${{ inputs.baseline-registry }}
        CHECK_POLICIES: ${{ inputs.policies }}
        CHECK_ADVICE_DATA: ${{ inputs.advice-data }}
        CHECK_REQUIRE: ${{ inputs.require }}
        CHECK_FAIL_ON: ${{ inputs.fail-on }}
        CHECK_TIMEOUT: ${{ inputs.timeout }}
        CHECK_OUTPUT: ${{ inputs.output }}
