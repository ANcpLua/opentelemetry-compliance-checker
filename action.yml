name: OpenTelemetry compliance check
description: Check telemetry with pinned Weaver and Semantic Conventions; fail if no telemetry is observed.
branding:
  icon: check-circle
  color: blue
inputs:
  file:
    description: Weaver sample JSON file, used when run is empty.
    default: telemetry.json
  run:
    description: Optional test command. Starts a local OTLP/gRPC receiver and checks the emitted telemetry.
    default: ''
  registry:
    description: Optional custom registry. Defaults to the pinned upstream Semantic Conventions.
    default: ''
  fail-on:
    description: Minimum finding level that fails CI (violation, improvement, information).
    default: violation
  timeout:
    description: Maximum test or file-check duration in seconds.
    default: '300'
  output:
    description: Directory for the summary, complete Weaver report, and engine diagnostics.
    default: otel-report
outputs:
  summary:
    description: Absolute path to the machine-readable summary.
    value: ${{ steps.check.outputs.summary }}
runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/scripts/action.py" pins
    - uses: open-telemetry/weaver/.github/actions/setup-weaver@38befce4bc68fe320d20f189465c93835ac20c12 # v0.26.1
      with:
        version: ${{ steps.pins.outputs.version }}
    - id: check
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/scripts/action.py" check
      env:
        CHECK_FILE: ${{ inputs.file }}
        CHECK_RUN: ${{ inputs.run }}
        CHECK_REGISTRY: ${{ inputs.registry }}
        CHECK_FAIL_ON: ${{ inputs.fail-on }}
        CHECK_TIMEOUT: ${{ inputs.timeout }}
        CHECK_OUTPUT: ${{ inputs.output }}
