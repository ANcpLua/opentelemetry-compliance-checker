name: Test checker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify default pinned upstream registry and action
        uses: ./
        with:
          file: examples/http-valid.json
          require: syntax semantics behavior stability
      - run: python3 -m unittest discover -s tests -v
      - name: Verify upstream rejects an invalid attribute type
        shell: bash
        run: |
          set +e
          ./otel-check check --output .test-output/upstream-invalid examples/invalid.json
          code=$?
          set -e
          test "$code" -eq 1
